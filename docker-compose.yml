services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

    networks:
      - backend

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: notes-app:local
    restart: unless-stopped

    ports:
      - "127.0.0.1:8000:8000"

    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      APP_NAME: ${APP_NAME:-notes}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SHUTDOWN_DELAY_SECONDS: ${SHUTDOWN_DELAY_SECONDS:-3}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-5}
      DB_WAIT_TIMEOUT: "60"

    depends_on:
      - db

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

    stop_grace_period: 80s

    networks:
      - backend

volumes:
  postgres_data:

networks:
  backend:
    driver: bridge